<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Raw WebSocket Chat Client</title>
  <style>
    body { font-family: monospace; background: #121212; color: #00ff66; padding: 20px; }
    #log { width: 100%; height: 300px; background: #000; border: 1px solid #00ff66; color: #00ff66; overflow-y: scroll; padding: 10px; }
    input, button { background: #222; border: 1px solid #00ff66; color: #00ff66; padding: 8px; margin: 4px; }
  </style>
</head>
<body>
  <h2>Raw RFC 6455 Client Engine</h2>
  <div>
    <label>Token:</label>
    <input type="text" id="token" value="token-user-1">
    <label>Port:</label>
    <input type="number" id="port" value="8000">
    <button onclick="connect()">Connect</button>
  </div>
  <br>
  <div id="log"></div>
  <br>
  <div>
    <input type="text" id="recipient" placeholder="Recipient ID (e.g. U200)">
    <input type="text" id="content" placeholder="Message content">
    <button onclick="sendPrivate()">Send Private</button>
  </div>
  <div>
    <input type="text" id="groupId" placeholder="Group ID (e.g. G10)">
    <input type="text" id="groupContent" placeholder="Group Message content">
    <button onclick="sendGroup()">Send Group</button>
  </div>

  <script>
    let ws;
    function log(txt) {
      const el = document.getElementById('log');
      el.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${txt}</div>`;
      el.scrollTop = el.scrollHeight;
    }

    function connect() {
      const token = document.getElementById('token').value;
      const port = document.getElementById('port').value;
      ws = new WebSocket(`ws://localhost:${port}/?token=${token}`);

      ws.onopen = () => log("CONNECTED_TO_NODE");
      ws.onmessage = (e) => log("RECEIVED: " + e.data);
      ws.onclose = () => log("DISCONNECTED");
      ws.onerror = (e) => log("ERROR: " + JSON.stringify(e));
    }

    function sendPrivate() {
      const recipientId = document.getElementById('recipient').value;
      const content = document.getElementById('content').value;
      ws.send(JSON.stringify({
        action: 'send_private_message',
        data: { recipientId, content }
      }));
    }

    function sendGroup() {
      const groupId = document.getElementById('groupId').value;
      const content = document.getElementById('groupContent').value;
      ws.send(JSON.stringify({
        action: 'send_group_message',
        data: { groupId, content }
      }));
    }
  </script>
</body>
</html>
